services:
  kroger-service:
    build:
      context: ./kroger-service
    env_file:
      - path: ./kroger-service/.env.dev
        required: false
    environment:
      PORT: "3001"
      KROGER_SERVICE_TOKEN: ${KROGER_SERVICE_TOKEN:-local-development-only-token}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    env_file:
      - ./backend/.env.dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      KROGER_SERVICE_URL: http://kroger-service:3001
      KROGER_SERVICE_TOKEN: ${KROGER_SERVICE_TOKEN:-local-development-only-token}
      KROGER_CLIENT_ID: ""
      KROGER_CLIENT_SECRET: ""
    depends_on:
      kroger-service:
        condition: service_healthy
    command: npm run dev

  frontend:
    ports:
      - "5173:5173"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  backend_node_modules:
  frontend_node_modules:
