services:
  backend:
    env_file:
      - ./backend/.env.dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: recipe-cost-backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: recipe-cost-frontend
    working_dir: /app
    ports:
      - "5172:5172"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5172
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0