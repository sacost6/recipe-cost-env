services:
  pricing-service:
    build:
      context: ./pricing-service
    env_file:
      - ./.env.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PRICING_SERVICE_TOKEN: ${PRICING_SERVICE_TOKEN:-local-development-pricing-token}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  kroger-service:
    build:
      context: ./kroger-service
    env_file:
      - ./.env.dev
    environment:
      PORT: "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    env_file:
      - ./.env.dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      KROGER_SERVICE_URL: http://kroger-service:3001
      PRICING_SERVICE_URL: http://pricing-service:8080
      PRICING_SERVICE_TOKEN: ${PRICING_SERVICE_TOKEN:-local-development-pricing-token}
    depends_on:
      kroger-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    command: npm run dev

  frontend:
    ports:
      - "5173:5173"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  backend_node_modules:
  frontend_node_modules:
